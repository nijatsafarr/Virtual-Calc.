<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NijatCalc. | Virtual Calculator</title>
    <link rel="shortcut icon" href="./money.png" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
</head>
<body>
   <div class="container">
    <p id="logoCalc">CASPIAN</p>
    <input id="screen">
    <div class="buttons">
        <button class="ctrlBtn" onclick="clearScrn('AC')">AC</button>
        <button class="ctrlBtn" onclick="delScrn()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16"><path fill="#fff" fill-rule="evenodd" d="M5.442 3.5H12.5A1.5 1.5 0 0 1 14 5v6a1.5 1.5 0 0 1-1.5 1.5H5.442a1.5 1.5 0 0 1-1.171-.563L1.796 8.844a1.35 1.35 0 0 1 0-1.688l2.475-3.093A1.5 1.5 0 0 1 5.44 3.5m-2.343-.374A3 3 0 0 1 5.442 2H12.5a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H5.442a3 3 0 0 1-2.343-1.126L.625 9.781a2.85 2.85 0 0 1 0-3.562zM7.28 5.47a.75.75 0 0 0-1.06 1.06L7.69 8L6.22 9.47a.75.75 0 1 0 1.06 1.06l1.47-1.47l1.47 1.47a.75.75 0 1 0 1.06-1.06L9.81 8l1.47-1.47a.75.75 0 0 0-1.06-1.06L8.75 6.94z" clip-rule="evenodd"/></svg></button>
        <button class="ctrlBtn" onclick="print('%')">%</button>
        <button class="ctrlBtn" onclick="print('/')"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-linejoin="round"><path stroke-width="3.75" d="M12 6.5h.01v.01H12zm0 11h.01v.01H12z"/><path stroke-linecap="round" stroke-width="2.5" d="M18 12H6"/></g></svg></button>
        <button onclick="print('7')">7</button>
        <button onclick="print('8')">8</button>
        <button onclick="print('9')">9</button>
        <button onclick="print('*')">X</button>
        <button onclick="print('4')">4</button>
        <button onclick="print('5')">5</button>
        <button onclick="print('6')">6</button>
        <button onclick="print('-')">−</button>
        <button onclick="print('1')">1</button>
        <button onclick="print('2')">2</button>
        <button onclick="print('3')">3</button>
        <button onclick="print('+')">+</button>
        <button onclick="print('00')">00</button>
        <button onclick="print('0')">0</button>
        <button onclick="print('.')">.</button>
        <button onclick="hesabla()">=</button>
    </div>
   </div>
   
   <script>
    const screen = document.querySelector("#screen")

    function print(x) {
     screen.value+= x   
    }
    function hesabla() {
      screen.value = eval(screen.value)
        }
    function clearScrn() {
        screen.value = ""
    }
    function delScrn() {
        screen.value = screen.value.slice(0, -1)
    }
    document.addEventListener("keydown", function(event) {
      const key = event.key 
      if (key >= "0" && key < "9") {print(key)}
      if (key == "Backspace") { delScrn()}
      if (key == "Delete") {clearScrn()}
      if (key == "Enter") { hesabla()}
      if (key == "%") {print("%")}
      if (key == "*") {print("*")}
      if (key == "/") {print("/")}
      if (key == "-") {print("-")}
      if (key == "+") {print("+")}
    })
   </script>
</body>
</html>
